name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Vision agent, Reasoning agent, Database, Pipeline / CLI, Docs / tooling]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      description: How will we know it's done?
      placeholder: "- [ ] ..."
