name: Task
description: A unit of planned work for the team
labels: [task]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Subtasks
      placeholder: "- [ ] ..."
  - type: input
    id: due
    attributes:
      label: Due date (optional)
