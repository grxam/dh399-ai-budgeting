name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Vision agent, Reasoning agent, Database, Pipeline / CLI, Docs / tooling]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Do NOT attach real receipts or personal data; use a synthetic or redacted image.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12"
